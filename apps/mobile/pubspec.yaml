name: daily_pilot
description: "Axon Dayli — kegiatan harian, keuangan, dan aset. Offline-first."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local database (offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Network & sync
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2

  # UI & utility
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  fl_chart: ^0.69.2

  # Notifications & security
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  image_picker: ^1.2.4
  file_picker: ^8.1.7
  shadcn_ui: ^0.40.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
